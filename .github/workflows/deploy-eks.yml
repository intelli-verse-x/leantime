# CodeBuild -> GitHub Actions migration (2026-07-05).
# Replaces: CodePipeline leantime-pipeline + CodeBuild leantime-build
# Rollback: re-enable the CodePipeline source trigger (DetectChanges=true).
name: Build & Deploy to EKS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 970547373533.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: ai-cart-auto-cluster

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Docker Hub (rate limits)
        continue-on-error: true
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push multi-arch image
        run: |
          set -euo pipefail
          IMAGE_TAG="$(echo "$GITHUB_SHA" | cut -c1-7)"
          REPOSITORY_URI="${ECR_REGISTRY}/leantime"
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            -t "$REPOSITORY_URI:latest" -t "$REPOSITORY_URI:$IMAGE_TAG" --no-cache --push .
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy to EKS
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          kubectl set image deployment/leantime leantime="${ECR_REGISTRY}/leantime:${IMAGE_TAG}" -n aicart
          kubectl rollout status deploy/leantime -n aicart --timeout=300s
